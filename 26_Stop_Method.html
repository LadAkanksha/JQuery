<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Method</title>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <style>
            #box {
            width: 100px;
            height: 100px;
            color: rgb(26, 5, 5);
            margin: 10px;
            padding: 10px;
            background-color: rgb(140, 234, 203);
            border: 1px solid brown;
            position: relative;
        }
        </style>
</head>
<body>
    <h1>JQuery Animate Method</h1>
    <div id="box">
        <p>Hello JQuery</p>
    </div>
    <br>
    <button id="btnAnime">Animate</button>
    <button id="btnStop">Stop</button>
    <script>
        $(document).ready(function(){
           $('#btnAnime').click(function(){
            $('#box').animate({left:'1000px',fontSize:'20px'},3000)
           });
           $('#btnStop').click(function(){
                $('#box').stop(true,true);       // To stop the current Animation
                // 1st parameter is for to stop the animation at Current Position
                // 2nd parameter is for to stop animation at current position and goes direct to end point
           });
        });
    </script>
</body>
</html>
