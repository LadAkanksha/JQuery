<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position & Offset Method</title>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <style>
            #box {
                color: rgb(26, 5, 5);
            margin: 10px;
            padding: 10px;
            background-color: rgb(140, 234, 203);
            border: 1px solid brown;
        }
        
        </style>
</head>
<body>
    <div id="box">
        <h2>JQuery Position & Offeset</h2>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ad, deleniti. Illum recusandae atque cupiditate. Harum consequatur ad optio qui voluptas placeat, cumque sed quo minus sit! Tenetur, cum architecto? Consequuntur.</p>
    </div>
    <button id="btnPosition">Position</button>
    <button id="btnOffset">Offset</button>
    <script>
        $(document).ready(function(){
            $('#btnPosition').click(function(){
                // console.log($('#box').position());
                var x = $('#box h2').position();
                console.log("Top : "+x.top + "Left : "+ x.left);

            })

            $('#btnOffset').click(function(){
                // console.log($('#box').offset());

                $('#box h2').offset({top:0, left:0});
            })
        });
    </script>
</body>
</html>
